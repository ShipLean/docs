# Independent, disposable screenshot stack. The runner gives every run its own project name.
services:
  shiplean:
    image: ${SHIPLEAN_IMAGE:-ghcr.io/shiplean/shiplean}
    ports:
      - "127.0.0.1:${SHIPLEAN_SHOTS_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHIPLEAN_DB_CONNECTION: Host=postgres;Port=5432;Database=shiplean;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SHIPLEAN_ADMIN_EMAIL: ${SHIPLEAN_ADMIN_EMAIL:?Set SHIPLEAN_ADMIN_EMAIL}
      SHIPLEAN_ADMIN_PASSWORD: ${SHIPLEAN_ADMIN_PASSWORD:?Set SHIPLEAN_ADMIN_PASSWORD}
      SHIPLEAN_BLOB_ROOT: /data/blobs
      # Setting both turns on Sign in with Google: the button, /api/auth/google/start and open signup.
      # The defaults are placeholders that nothing can sign in with, so the sign-in capture shows the button.
      # The app refuses to start with only one of the two set, so override both or neither.
      SHIPLEAN_GOOGLE_CLIENT_ID: ${SHIPLEAN_GOOGLE_CLIENT_ID:-shots-placeholder.example.invalid}
      SHIPLEAN_GOOGLE_CLIENT_SECRET: ${SHIPLEAN_GOOGLE_CLIENT_SECRET:-placeholder-not-a-secret}
    volumes:
      - blobs:/data/blobs
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      TZ: UTC
      POSTGRES_DB: shiplean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiplean"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
  blobs:
