# NGINX server/location excerpt. Replace the upstream name and public host.
# Keep ShipLean on a private network; do not publish its port to clients.
# Authelia NGINX: https://www.authelia.com/integration/proxies/nginx/
# Trusted headers: https://www.authelia.com/integration/trusted-header-sso/introduction/
upstream shiplean_backend {
    server shiplean:8080;
}

upstream authelia_authz {
    server authelia:9091;
}

server {
    listen 443 ssl;
    server_name shiplean.example.com;
    ssl_certificate /etc/nginx/tls/shiplean.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/shiplean.example.com.key;

    # Authelia auth-request subrequest. Configure Authelia's auth-request
    # endpoint with Remote-Email and Remote-Name response headers enabled.
    location = /internal/authelia/authz {
        internal;
        proxy_pass http://authelia_authz/api/authz/auth-request;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_pass_request_body off;
    }

    # These endpoints do their own authentication or serve discovery metadata.
    # Clear identity headers supplied by the browser; never let a client choose
    # its identity on a path that bypasses Authelia.
    location ~ ^/(mcp|oauth/(token|register|revoke)|\.well-known|api/(webhooks|uploads|downloads))(/|$) {
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://shiplean_backend;
    }

    # All other requests require Authelia. Replace any client copies with the
    # identity returned by Authelia's auth-request endpoint.
    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        proxy_set_header Remote-Email $email;
        proxy_set_header Remote-Name $name;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://shiplean_backend;
    }
}
