# oauth2-proxy 7.x TOML configuration for direct upstream proxying.
# Replace every example value and keep client_secret/cookie_secret in a secret store.
# Flag reference: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/
provider = "oidc"
oidc_issuer_url = "https://idp.example.com/realms/main"
client_id = "shiplean"
client_secret = "<oauth-client-secret>"
redirect_url = "https://shiplean.example.com/oauth2/callback"
email_domains = ["*"]
scope = "openid email profile"
code_challenge_method = "S256"
cookie_secret = "<generate-a-random-cookie-secret>"

# ShipLean is reachable only on the private container/network address.
upstreams = ["http://shiplean:8080/"]
reverse_proxy = true
trusted_proxy_ips = ["10.20.0.0/24"] # Replace with the actual ingress/proxy peer ranges.
cookie_secure = true

# ShipLean validates this forwarded access token as a JWT.
pass_access_token = true
skip_auth_strip_headers = true

# Exempt only protocols and endpoints which perform their own authentication.
skip_auth_routes = [
  "^/mcp(/.*)?$",
  "^/oauth/(token|register|revoke)(/.*)?$",
  "^/\\.well-known(/.*)?$",
  "^/api/webhooks(/.*)?$",
  "^/api/uploads(/.*)?$",
  "^/api/downloads(/.*)?$",
]

# Provide the required values through the deployment secret manager or config.
# Example: client_secret_file = "/run/secrets/oauth_client_secret"
