# Tempo for a small Agent runs setup: one process, local storage, 30 day retention. A short trace_idle_period and max_block_duration
# make a finished run searchable within a few seconds; the defaults are slower (see 'Search lag' in the collector docs).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 1s
  max_block_duration: 5s
  lifecycler:
    min_ready_duration: 0s

compactor:
  compaction:
    block_retention: 720h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
