name: Capture screenshots

on:
  workflow_dispatch:
  push:
    branches: ['shots/**']

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHIPLEAN_IMAGE: ghcr.io/shiplean/shiplean:3026840aedef50b41467bc2eabe827d8cddd4a55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Write the private configuration
        run: |
          umask 077
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf '{"admin":{"email":"docs@example.com","password":"%s"}}' "$password" > "$RUNNER_TEMP/shots.json"
          chmod 600 "$RUNNER_TEMP/shots.json"
      - name: Capture
        # The Google placeholder values are the defaults in scripts/shots/docker-compose.yml.
        run: pnpm shots --config "$RUNNER_TEMP/shots.json"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: src/assets/shots
          if-no-files-found: warn
  seed-test:
    # Runs the seed integration test on its own stack, so it cannot change the images the capture job takes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHIPLEAN_IMAGE: ghcr.io/shiplean/shiplean:3026840aedef50b41467bc2eabe827d8cddd4a55
      COMPOSE_PROJECT_NAME: shiplean-seed-test
      SHIPLEAN_SHOTS_PORT: '18081'
      SHIPLEAN_ADMIN_EMAIL: docs@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the disposable passwords
        run: |
          umask 077
          admin="$(openssl rand -hex 24)"
          database="$(openssl rand -hex 24)"
          echo "::add-mask::$admin"
          echo "::add-mask::$database"
          echo "SHIPLEAN_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$database" >> "$GITHUB_ENV"
          printf '{"baseUrl":"http://127.0.0.1:18081","admin":{"email":"docs@example.com","password":"%s"}}' "$admin" > "$RUNNER_TEMP/seed-runtime.json"
          chmod 600 "$RUNNER_TEMP/seed-runtime.json"
      - name: Start the stack
        run: |
          docker compose -f scripts/shots/docker-compose.yml up -d --wait --wait-timeout 120
          # The app service has no healthcheck, so --wait does not cover it.
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18081/health > /dev/null && exit 0
            sleep 2
          done
          echo "ShipLean did not answer GET /health within 120 seconds."
          exit 1
      - name: Seed test
        env:
          SHIPLEAN_SEED_RUNTIME_FILE: ${{ runner.temp }}/seed-runtime.json
        run: timeout 300 pnpm test:seed
      - name: Remove the stack
        if: always()
        run: docker compose -f scripts/shots/docker-compose.yml down --volumes --remove-orphans
